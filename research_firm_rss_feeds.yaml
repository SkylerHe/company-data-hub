# NOTES ON DATA QUALITY

quality_assessment:
  tier_1_research:
    firms: ["Gartner", "Forrester", "S&P Global", "Moody's", "CB Insights", "PitchBook"]
    characteristics: "Proprietary data collection, rigorous methodology, institutional-grade research"
    best_for: "Strategic decisions, market sizing, competitive intelligence"

  tier_2_specialized:
    firms: ["SemiAnalysis", "Wood Mackenzie", "Rystad Energy", "Omdia", "IC Insights/TechInsights"]
    characteristics: "Deep domain expertise, industry-specific data, technical depth"
    best_for: "Sector-specific investment research, technical due diligence"

  tier_3_news_analysis:
    firms: ["BioPharma Dive", "FierceBiotech", "EE Times", "Crunchbase News", "Seeking Alpha"]
    characteristics: "Timely news, broader coverage, community/journalist-driven"
    best_for: "Daily monitoring, event-driven trading, industry pulse"

# INTEGRATION TIPS

integration_recommendations:
  rss_reader_setup:
    - "Use Feedly, Inoreader, or self-hosted FreshRSS for feed aggregation"
    - "Create folders by industry sector (Biotech, Semis, Fintech, Energy, etc.)"
    - "Set up keyword filters for specific companies/topics you track"
    - "Use AI summarization tools to process high-volume feeds"

  workflow_suggestions:
    - "Combine free RSS feeds with paid research for comprehensive coverage"
    - "Use BioPharma Dive/FierceBiotech for FDA catalysts and trial results"
    - "Monitor Crunchbase for private funding rounds in your sectors"
    - "Track Seeking Alpha for diverse analyst perspectives on public companies"
    - "Subscribe to industry-specific newsletters as supplement to RSS"

  data_enrichment:
    - "Cross-reference RSS news with SEC filings and earnings transcripts"
    - "Use company-data-hub scraper to track specific portfolio companies"
    - "Combine industry news with financial data (FactSet, Bloomberg, etc.)"
    - "Set up alerts for M&A, funding rounds, FDA approvals, product launches"

# LEGAL AND USAGE NOTES

usage_guidelines:
  - "Most RSS feeds are for personal, non-commercial use only"
  - "Seeking Alpha explicitly restricts commercial use of RSS feeds"
  - "Commercial/institutional use may require licensing agreements"
  - "Respect robots.txt and rate limiting when programmatically accessing feeds"
  - "Some paywalled content may show headlines only in RSS feeds"
  - "API access often required for commercial data applications"
  - "Always attribute sources when sharing or republishing content"
